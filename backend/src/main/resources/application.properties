spring.application.name=cartwise

# Railway (and most hosts) pass the port to listen on in $PORT
server.port=${PORT:8080}

# Default: in-memory H2 so the project runs with zero setup.
# Use the "postgres" profile (application-postgres.properties) for PostgreSQL.
spring.datasource.url=jdbc:h2:mem:cartwise;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# JWT signing secret (HS256). Override with the CARTWISE_JWT_SECRET env var in any real deployment.
cartwise.jwt.secret=${CARTWISE_JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min!!}
cartwise.jwt.ttl-minutes=720

# Seed demo categories, products and accounts on startup
cartwise.seed.enabled=true

# Comma-separated frontend origins allowed to call the API (the deployed web URL in production)
cartwise.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Actuator: expose only the health check used by the host
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
